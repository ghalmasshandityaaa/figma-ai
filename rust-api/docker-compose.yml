name: rust-api

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "15432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  tempo:
    image: grafana/tempo:2.5.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "13200:3200"   # tempo query api
      - "14317:4317"   # otlp grpc
      - "14318:4318"   # otlp http

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlSearch tempoApmTable"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "13000:3000"
    depends_on:
      - tempo

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      HTTP_HOST: "0.0.0.0"
      HTTP_PORT: "8080"
      DATABASE_URL: "postgres://app:app@postgres:5432/app"
      DATABASE_MAX_CONNECTIONS: "20"
      PASETO_KEY: "RsiDWgpMTlbpAfKuYlnJtBsvADvCrIqcHZyDEle2OqM="
      TOKEN_TTL_SECONDS: "3600"
      OTLP_ENDPOINT: "http://tempo:4317"
      SERVICE_NAME: "rust-api"
      CORS_ALLOWED_ORIGINS: ""
      RATE_LIMIT_PER_MINUTE: "120"
      RATE_LIMIT_BURST: "20"
      MAX_BODY_BYTES: "1048576"
      RUST_LOG: "info,sqlx=warn"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      tempo:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://app:app@postgres:5432/app"
      DATABASE_MAX_CONNECTIONS: "10"
      PASETO_KEY: "RsiDWgpMTlbpAfKuYlnJtBsvADvCrIqcHZyDEle2OqM="
      OTLP_ENDPOINT: "http://tempo:4317"
      SERVICE_NAME: "rust-api"
      RUST_LOG: "info,sqlx=warn"
    depends_on:
      postgres:
        condition: service_healthy
      tempo:
        condition: service_started

  migrator:
    build:
      context: .
      dockerfile: docker/migrator.Dockerfile
    profiles: ["tools"]
    environment:
      DATABASE_URL: "postgres://app:app@postgres:5432/app"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  tempo_data:
